site_name: BioFMI
site_description: FM-index for Elastic-Degenerate Strings — pangenomic pattern matching
site_url: https://draessld.github.io/biofmi
repo_url: https://github.com/draessld/biofmi
repo_name: draessld/biofmi
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Guides:
      - Installation: installation.md
      - Quick start: quickstart.md
      - Search modes: search_modes.md
      - Running experiments: experiments.md
  - Reference:
      - CLI reference: cli.md
      - locate() specification: locate_spec.md
      - File formats: file_formats.md
  - Internals:
      - Architecture: architecture.md
      - Index internals: index_internals.md
  - Evaluation:
      - Experiment design: experiment_design.md
