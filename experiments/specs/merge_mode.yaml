experiment: merge_mode
description: |
  LINEAR vs CARTESIAN l-EDS: build cost, index cost, query cost, across an l sweep.

  The two merge modes are the same transform with and without source information.
  CARTESIAN keeps every combination of adjacent alternatives; LINEAR keeps only
  those some path actually carries. The comparison measures what phasing buys —
  in space, in build feasibility, and in query precision.

  Port of the old run_merge_mode_experiment.sh shell harness (deleted 2026-08-25;
  recoverable from git history). Same knobs, same tools, same
  measurement conventions; the harness supplies the plumbing.

# --------------------------------------------------------------------------
# Binaries. Build tree before PATH, always: ~/.local/bin is normally on PATH,
# and a stale eds2leds emits contaminated l-EDS without erroring.
# --------------------------------------------------------------------------
resolve:
  prefer:
    - build/tools
    - external/edsparser/build/tools

binaries:
  eds2leds:
    provenance:
      require_after: "2026-08-04T14:16:54Z"   # the complement fix, 20d8ff1
      require_fields: [COMMIT, COMMIT_DATE, DIRTY]
  edsparser-stats: {}
  edsparser-genpatterns: {}
  biofmi-build: {}
  biofmi-locate: {}

vars:
  n_patterns: 200
  pattern_alphabet: ACGT
  seed: 7
  decoy_oversample: 4

policy:
  mem_cap: 8G          # per run
  mem_budget: 24G      # across all concurrent runs
  timeout: 600s
  reps: 1
  mem_backend: watchdog
  poll_ms: 25
  jobs: 4
  env:
    OMP_NUM_THREADS: "1"   # so a parallel stage does not oversubscribe

gather:
  gzip: true
  gzip_level: 6
  count_lines_ext: [".txt", ".csv", ".seds"]
  jobs: 4

# --------------------------------------------------------------------------
# Datasets
# --------------------------------------------------------------------------
datasets:
  covid294:
    inputs:
      eds: ~/Data/covid/derived/covid294.eds
      seds: ~/Data/covid/derived/covid294.seds
    probe:
      cmd: "{edsparser-stats} -i {in.eds} -s {in.seds}"
      extract:
        ctx_avg:    {regex: 'Average:\s+([0-9.]+)'}
        ctx_max:    {regex: 'Maximum:\s+([0-9.]+)', cast: int_grouped}
        num_paths:  {regex: 'Total paths \(genomes\):\s+([0-9.]+)', cast: int_grouped}
        n_symbols:  {regex: 'Number of symbols \(n\):\s+([0-9.]+)', cast: int_grouped}

# --------------------------------------------------------------------------
# The sweep. Every l must satisfy (l+1) | pattern_len — biofmi-locate requires
# |P| to be a multiple of l+1, so an arbitrary sweep has no common pattern
# length and no comparable curve. 120 is highly composite, hence the anchor.
# --------------------------------------------------------------------------
grid:
  l: [3, 5, 9, 11, 14, 19, 29, 39, 59]
  pattern_len: [120]

cell_slug: "l{l}"
stages: [prepare, build, query]

# --------------------------------------------------------------------------
# Tools
# --------------------------------------------------------------------------
tools:
  linear:
    label: LINEAR (phasing-aware)
    constraints:
      - "pattern_len % (l + 1) == 0"
      - "l >= 3"
    stages:
      prepare:
        cmd: "{eds2leds} -i {in.eds} -s {in.seds} -l {l} -o {out}/merged.leds"
        produces:
          leds: "{out}/merged.leds"
        produces_optional:
          leds_sources: "{out}/merged.seds"
        parallel: true          # merges are independent; only their own cost is timed
        extract:
          iterations: {from: stdout, regex: 'Converged after (\d+) iterations'}
          tool_peak_mb: {from: stderr, regex: 'Peak Memory:\s*([0-9.]+) MB'}

      build:
        cmd: "{biofmi-build} -i {prod.leds} -l {l} -o {out}/index"
        needs: [prepare]
        produces:
          index: "{out}/index"
        produces_optional:
          index_ri: "{out}/index/index.ri"
          index_ci: "{out}/index/index.ci"
        parallel: false         # timed alone on the machine

      query:
        cmd: "{biofmi-locate} --benchmark -i {prod.index} -l {l} -P {patterns}"
        needs: [build]
        parallel: false
        reps: 5
        timing: {mode: difference}   # N and 2N, subtract: the load term cancels
        matrix:
          pattern_set: [real, decoy, negative]
        extract:
          # biofmi-locate puts the per-pattern hits on stdout and the summary
          # lines on stderr, so the two extractors read different streams.
          # KNOWN WRONG, kept deliberately. [ACGT]+ cannot match the 51 of 200
          # decoys that carry an IUPAC ambiguity code (N R S Y K), so `matched`
          # is capped at 149 for that set — the flat CARTESIAN 149/200 in
          # results/covid294 is this regex, not a property of the index. Fixed
          # to [A-Z]+ in specs/cartesian.yaml and specs/linear.yaml; left alone
          # here because this spec's job is to reproduce results/covid294
          # byte-for-byte, and correcting it would break that by design.
          matched:      {from: stdout, count_lines: '^[ACGT]+\t[1-9][0-9]*$'}
          occurrences:  {from: stderr, regex: 'Total occurrences:\s*([0-9]+)'}
          n_queried:    {from: stderr, regex: 'Total patterns:\s*([0-9]+)'}
          tool_peak_mb: {from: stderr, regex: 'Peak Memory:\s*([0-9.]+) MB'}

  cartesian:
    label: CARTESIAN (all combinations)
    extends: linear
    stages:
      prepare:
        cmd: "{eds2leds} -i {in.eds} -l {l} -o {out}/merged.leds"

# --------------------------------------------------------------------------
# Pattern sets. One set per dataset, shared across every l and both modes —
# regenerating per cell would compare different queries.
# --------------------------------------------------------------------------
querysets:
  real:
    # source-aware: each pattern walks one path, so it is a substring of a
    # genome in the panel. Both modes must find every one of these.
    cmd: "{edsparser-genpatterns} -i {in.eds} -s {in.seds} -o {out} -n {n_patterns} -l {pattern_len} --seed {seed}"

  negative:
    # random ACGT, essentially never present. Isolates early-exit cost.
    builtin: random_string
    axes: [pattern_len]
    vars: {alphabet: ACGT}

  decoy:
    # cartesian-only strings: generated ignoring sources, then filtered to
    # those a LINEAR index does not contain. Needs a built index, so it waits.
    hook: hooks/decoy_patterns.py:generate
    after: build
    axes: [pattern_len]

# --------------------------------------------------------------------------
# Plots
# --------------------------------------------------------------------------
plots:
  - id: leds_size_vs_l
    stage: prepare
    x: l
    y: artifact_bytes
    series: tool
    facet: dataset
    logy: true
    title: "l-EDS size vs l — what phasing saves"
    ylabel: bytes

  - id: merge_peak_vs_l
    stage: prepare
    x: l
    y: peak_rss_mb
    series: tool
    facet: dataset
    logy: true
    title: "Merge peak RSS vs l"
    ylabel: peak RSS (MB)

  - id: index_size_vs_l
    stage: build
    x: l
    y: artifact_bytes
    series: tool
    facet: dataset
    title: "Index size vs l"
    ylabel: bytes

  - id: build_time_vs_l
    stage: build
    x: l
    y: wall_s_min
    series: tool
    facet: dataset
    title: "Index build time vs l"
    ylabel: seconds

  - id: query_time_vs_l
    stage: query
    x: l
    y: query_ms_per_query
    series: pattern_set
    facet: tool
    logy: true
    where: "tool == 'linear' or tool == 'cartesian'"
    title: "Query time per pattern vs l (index load subtracted)"
    ylabel: ms / pattern

  - id: recall_vs_l
    stage: query
    x: l
    y: matched
    series: pattern_set
    facet: tool
    title: "Patterns matched — recall on real, precision loss on decoy"
    ylabel: patterns matched (of 200)

  - id: space_time_tradeoff
    stage: query
    kind: scatter
    x: wall_s_min
    y: query_ms_per_query
    series: tool
    facet: dataset
    annotate: l
    logx: true
    logy: true
    where: "pattern_set == 'real'"
    title: "The trade-off: query cost against index cost, labelled by l"
